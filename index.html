// ------------------------------------------------------------ PC 화면 (PC 프로그램과 같은 모양)
// 데이터·암호·고치기(작업을 만들어 올리기)는 위 코드를 그대로 쓰고, 그리기와 마우스·키보드 조작만 PC 프로그램을 따른다.
// 고칠 수 있는 범위는 폰과 같다: 추가, 체크, ★, 글, 날짜·섹션 옮기기, 삭제 (기간·반복·섹션 설정은 PC 프로그램에서만)
const PC_MODE_STORE = "libird.pc.mode";        // 마지막 보기: year / month / day
const PC_FOLD_STORE = "libird.pc.overdueFolded"; // 밀린 일 패널 접힘
const pc = {mode: "month", cur: null, today: null, chosen: new Set(), anchor: null, editing: false,
  dragSel: false, wheel: 0, keptDate: null, tipEl: null, dateDone: null};
let FH = 0, LH = 0;  // 글자 높이, 월 보기 줄 높이(글자 높이+2)

if (PC) {
  const m = lsGet(PC_MODE_STORE);
  if (["year", "month", "day"].includes(m)) pc.mode = m;
  $("#pc-foot").append($("#status"), $("#updated"));
}

const addDays = (k, n) => { const d = fromIso(k); return iso(new Date(d.getFullYear(), d.getMonth(), d.getDate() + n)); };
function addMonths(k, n) {  // 그 달에 없는 날(31일, 2/29)은 말일로
  const d = fromIso(k), first = new Date(d.getFullYear(), d.getMonth() + n, 1);
  const last = new Date(first.getFullYear(), first.getMonth() + 1, 0).getDate();
  return iso(new Date(first.getFullYear(), first.getMonth(), Math.min(d.getDate(), last)));
}
const wdOf = (k) => WEEKDAYS[pyWd(fromIso(k))];
const fullLabel = (k) => { const d = fromIso(k); return `${d.getFullYear()}년 ${d.getMonth() + 1}월 ${d.getDate()}일 (${wdOf(k)})`; };
const shortLabel = (k) => { const d = fromIso(k); return `${d.getMonth() + 1}/${d.getDate()} (${wdOf(k)})`; };
const dayCls = (k) => pyWd(fromIso(k)) === 6 || snap.holidays[k] ? "r" : pyWd(fromIso(k)) === 5 ? "b" : "";
const secMap = () => Object.fromEntries(snap.sections.map((s) => [s.id, s]));
const secColor = (secs, id) => (secs[id] || {}).color || "#8A9099";
function rgba(hex, a) {
  const n = parseInt(String(hex).slice(1, 7), 16) || 0;
  return `rgba(${(n >> 16) & 255},${(n >> 8) & 255},${n & 255},${a})`;
}
function measure() {
  if (FH) return;
  const p = document.createElement("span");
  p.textContent = "가Ag";
  p.style.cssText = "position:absolute;visibility:hidden;line-height:normal;font-size:10pt";
  $("#pc").append(p);
  FH = Math.ceil(p.getBoundingClientRect().height) || 18;
  p.remove();
  LH = FH + 2;
}

function renderPC() {
  const c = fromIso(pc.cur);
  $("#pc-title").textContent = pc.mode === "year" ? `${c.getFullYear()}년` : `${c.getFullYear()}년 ${c.getMonth() + 1}월`;
  for (const b of document.querySelectorAll("#pc-modes button")) b.classList.toggle("on", b.dataset.m === pc.mode);
  if (pc.editing) return;  // 글을 고치는 중에는 다시 그리지 않는다 (끝나면 그린다)
  measure();
  hideTip();
  const v = $("#pc-view");
  if (pc.mode === "year") renderYear(v);
  else if (pc.mode === "month") renderMonth(v);
  else renderPcDay(v);
  // 보는 범위 일부가 PC가 보내는 기간 밖이면 알린다 (그 밖은 비어 보인다)
  const [lo, hi] = snap.range;
  const a = pc.mode === "year" ? `${c.getFullYear()}-01-01` : pc.mode === "month" ? iso(new Date(c.getFullYear(), c.getMonth(), 1)) : pc.cur;
  const b = pc.mode === "year" ? `${c.getFullYear()}-12-31` : pc.mode === "month" ? iso(new Date(c.getFullYear(), c.getMonth() + 1, 0)) : pc.cur;
  $("#pc-range").textContent = a < lo || b > hi ? `PC가 보내는 기간: ${lo} ~ ${hi} (그 밖은 비어 보여요)` : "";
}

// ---------------- 년 보기
function renderYear(v) {
  const year = fromIso(pc.cur).getFullYear(), t = new Date(), tk = iso(t), ws = snap.week_start;
  const W = v.clientWidth, H = v.clientHeight, cols = W >= H * 1.1 ? 4 : 3, rows = 12 / cols;
  const cw = ((W - 10) / cols - 6 - 12) / 7, ch = ((H - 10) / rows - 6 - 25 - 6) / 7;
  const fs = Math.max(7, Math.min(ch * 0.5, cw * 0.45, FH * 0.85));
  let html = `<div class="yv" style="grid-template-columns:repeat(${cols},minmax(0,1fr));grid-template-rows:repeat(${rows},minmax(0,1fr));`
    + `--yfs:${fs.toFixed(1)}px;--yr:${(Math.min(cw, ch) * 0.84).toFixed(1)}px;--ydot:${Math.max(3, ch * 0.12).toFixed(1)}px">`;
  for (let m = 0; m < 12; m++) {
    const first = new Date(year, m, 1), offset = (pyWd(first) - ws + 7) % 7, days = new Date(year, m + 1, 0).getDate();
    const cur = year === t.getFullYear() && m === t.getMonth();
    html += `<div class="ym${cur ? " cur" : ""}" data-m="${m}"><div class="t">${m + 1}월</div><div class="g">`;
    for (let c = 0; c < 7; c++) {
      const wd = (ws + c) % 7;
      html += `<span class="w ${wd === 6 ? "r" : wd === 5 ? "b" : ""}">${WEEKDAYS[wd]}</span>`;
    }
    for (let i = 0; i < 42; i++) {
      const day = i - offset + 1;
      if (day < 1 || day > days) { html += "<span></span>"; continue; }
      const k = iso(new Date(year, m, day)), list = data.days[k] || [];
      const dot = list.length ? `<i class="${list.some((e) => !e.done) ? "" : "done"}"></i>` : "";
      html += `<span class="d ${dayCls(k)}${k === tk ? " today" : ""}" data-d="${k}"><b>${day}</b>${dot}</span>`;
    }
    html += `</div></div>`;
  }
  v.innerHTML = html + `</div>`;
}

// ---------------- 월 보기
// 주 한 줄(7일)의 줄 배치 (PC month_view.week_lines와 같다): 기간 일정은 주 안에서 같은 줄을 써서 막대로 잇는다.
// 먼저 시작한 것, 같으면 긴 것이 위 줄이고, 하루 일정은 그날 비어 있는 줄을 위에서부터 채운다.
function weekLines(keys) {
  const spans = new Map();
  for (const k of keys) for (const e of data.days[k] || []) if (e.p && !spans.has(e.id)) spans.set(e.id, e);
  const seen = [...spans.keys()];
  const len = (e) => Math.round((fromIso(e.p[1]) - fromIso(e.p[0])) / 864e5);
  const order = [...spans.values()].sort((a, b) =>
    (a.p[0] < b.p[0] ? -1 : a.p[0] > b.p[0] ? 1 : 0) || len(b) - len(a) || seen.indexOf(a.id) - seen.indexOf(b.id));
  const used = Object.fromEntries(keys.map((k) => [k, new Set()]));
  const lane = {};
  for (const e of order) {
    const cover = keys.filter((k) => e.p[0] <= k && k <= e.p[1]);
    let n = 0;
    while (cover.some((k) => used[k].has(n))) n++;
    lane[e.id] = n;
    for (const k of cover) used[k].add(n);
  }
  const out = {};
  for (const k of keys) {
    const day = data.days[k] || [];
    const rows = day.filter((e) => e.p).map((e) => [lane[e.id], e]);
    let free = 0;
    for (const e of day) {
      if (e.p) continue;
      while (used[k].has(free)) free++;
      rows.push([free++, e]);
    }
    out[k] = rows.sort((a, b) => a[0] - b[0]);
  }
  return out;
}

function runs(cols) {  // [0, 1, 2, 5, 6] → [[0, 2], [5, 6]]
  const out = [];
  for (const c of cols) {
    if (out.length && out[out.length - 1][1] === c - 1) out[out.length - 1][1] = c;
    else out.push([c, c]);
  }
  return out;
}

const itemText = (e) => (e.star ? `<span class="s">★ </span>` : "") + esc(e.t);

function renderMonth(v) {
  const c = fromIso(pc.cur), ws = snap.week_start, tk = iso(new Date());
  const first = new Date(c.getFullYear(), c.getMonth(), 1), offset = (pyWd(first) - ws + 7) % 7;
  const start = new Date(c.getFullYear(), c.getMonth(), 1 - offset);
  const weeks = Math.ceil(Math.round((new Date(c.getFullYear(), c.getMonth() + 1, 1) - start) / 864e5) / 7);
  const late = {};  // 마감일별 밀린 미완료 수 (기간 일정은 끝날에 센다)
  for (const e of data.overdue) { const due = e.p ? e.p[1] : e.date; late[due] = (late[due] || 0) + 1; }
  let html = `<div class="mv" style="--lh:${LH}px;--fh:${FH}px"><div class="mwd">`;
  for (let i = 0; i < 7; i++) {
    const wd = (ws + i) % 7;
    html += `<span class="${wd === 6 ? "r" : wd === 5 ? "b" : ""}">${WEEKDAYS[wd]}</span>`;
  }
  html += `</div><div class="mweeks" style="grid-template-rows:repeat(${weeks},minmax(0,1fr))">`;
  const weekKeys = [];
  for (let w = 0; w < weeks; w++) {
    const keys = [];
    html += `<div class="wk">`;
    for (let i = 0; i < 7; i++) {
      const d = new Date(start.getFullYear(), start.getMonth(), start.getDate() + w * 7 + i), k = iso(d);
      keys.push(k);
      const hol = snap.holidays[k], n = k < tk ? late[k] : 0;
      const cls = ["mc", d.getMonth() !== c.getMonth() && "out", k === tk && "today"].filter(Boolean).join(" ");
      html += `<div class="${cls}" data-d="${k}"><div class="h"><span class="n ${dayCls(k)}">${d.getDate()}</span>`
        + (hol ? `<span class="hol">${esc(hol)}</span>` : "") + (n ? `<span class="bd">${n}</span>` : "") + `</div></div>`;
    }
    html += `</div>`;
    weekKeys.push(keys);
  }
  v.innerHTML = html + `</div></div>`;
  const secs = secMap();
  v.querySelectorAll(".wk").forEach((wk, w) => paintWeek(wk, weekKeys[w], c.getMonth(), secs));
}

// 한 주의 항목: 칸 높이에 들어가는 줄만 보이고, 넘치면 마지막 줄에 「+N개」 (PC _paint_items와 같은 계산)
function paintWeek(wk, keys, month, secs) {
  const cw = wk.clientWidth / 7, H = wk.clientHeight;
  const left = (c) => c * cw + 8, right = (c) => (c + 1) * cw - 8;  // 칸(2 들임)의 안쪽(6 들임)
  const top = 6 + LH + 2, bottom = H - 6;
  const avail = Math.floor((bottom + 2 - top) / LH);
  const lines = weekLines(keys);
  const limit = {};
  for (const k of keys) {
    const need = lines[k].length ? lines[k][lines[k].length - 1][0] + 1 : 0;
    limit[k] = need <= avail ? need : Math.max(0, avail - 1);
  }
  const other = (k) => fromIso(k).getMonth() !== month;
  let html = "";
  const spans = new Map();
  for (const k of keys) for (const [n, e] of lines[k]) if (e.p && !spans.has(e.id)) spans.set(e.id, [n, e]);
  for (const [n, e] of spans.values()) {  // 줄이 보이는 칸끼리 이어서 막대로
    const cols = keys.map((k, i) => (e.p[0] <= k && k <= e.p[1] && n < limit[k] ? i : -1)).filter((i) => i >= 0);
    const col = secColor(secs, e.s);
    for (const [c0, c1] of runs(cols)) {
      html += `<div class="mbar${e.done ? " done" : ""}${other(keys[c0]) ? " oth" : ""}" style="left:${left(c0) - 2}px;`
        + `top:${top + n * LH + 1}px;width:${right(c1) - left(c0) + 4}px;height:${LH - 2}px;background:${rgba(col, e.done ? 0.11 : 0.235)}">`
        + (keys[c0] === e.p[0] ? `<i class="strip" style="background:${rgba(col, e.done ? 0.43 : 1)}"></i>` : "")
        + `<span class="x">${itemText(e)}</span></div>`;
    }
  }
  const r = Math.max(3, FH * 0.17);
  keys.forEach((k, i) => {
    for (const [n, e] of lines[k]) {
      if (e.p || n >= limit[k]) continue;
      html += `<div class="mi${e.done ? " done" : ""}${other(k) ? " oth" : ""}" style="left:${left(i)}px;top:${top + n * LH}px;`
        + `width:${right(i) - left(i)}px"><i class="dt" style="width:${2 * r}px;height:${2 * r}px;`
        + `background:${rgba(secColor(secs, e.s), e.done ? 0.43 : 1)}"></i><span class="x">${itemText(e)}</span></div>`;
    }
    const rest = lines[k].filter(([n]) => n >= limit[k]).length, y = top + limit[k] * LH;
    if (rest && y + LH <= bottom + 2) html += `<div class="mmore" style="left:${left(i)}px;top:${y}px">+${rest}개</div>`;
  });
  wk.insertAdjacentHTML("beforeend", html);
}

// ---------------- 일 보기
function pcColumns(n, w, h) {  // PC DayView._columns와 같다
  if (w >= 780 && w >= h * 1.5) return n <= 4 ? n : Math.ceil(n / 2);
  return n <= 3 || w < 600 ? 1 : 2;
}

function periodTip(p, k) {
  const total = Math.round((fromIso(p[1]) - fromIso(p[0])) / 864e5) + 1;
  const nth = Math.round((fromIso(k) - fromIso(p[0])) / 864e5) + 1;
  return `기간: ${shortLabel(p[0])} ~ ${shortLabel(p[1])}, ${total}일 중 ${nth}일째`;
}

function pcRow(e, k) {
  const cls = [e.done && "done", pendingIds.has(e.id) && "pending", pc.chosen.has(e.id) && "sel"].filter(Boolean).join(" ");
  const tip = e.p ? periodTip(e.p, k) : e.r ? "반복 항목" : "";
  return `<li class="${cls}" data-id="${esc(e.id)}"${tip ? ` data-tip="${esc(tip)}"` : ""}><span class="cbx"></span>`
    + `<span class="tx">${esc(e.t)}${e.p ? `&nbsp; · ${spanLabel(e.p)}` : ""}</span>`
    + (e.r ? `<span class="rc">↻</span>` : "")
    + `<span class="pst${e.star ? "" : " off"}">${e.star ? "★" : "☆"}</span></li>`;
}

function overdueHtml(ed) {
  const list = data.overdue;
  if (!list.length) return "";
  const folded = lsGet(PC_FOLD_STORE) === "1", secs = secMap();
  let html = `<div class="odp"><div class="oh"><button type="button" class="tg">${folded ? "▸" : "▾"}&nbsp; 밀린 일 ${list.length}개</button>`
    + (ed && !folded && list.length > 1 ? `<button type="button" class="all">모두 오늘로</button>` : "") + `</div>`;
  if (!folded) {
    html += `<ul>` + list.map((e) => {
      const sec = secs[e.s];
      return `<li class="${pendingIds.has(e.id) ? "pending" : ""}" data-id="${esc(e.id)}"><span class="cbx"></span>`
        + `<span class="tx">${e.star ? "★ " : ""}${esc(e.t)}</span>`
        + `<span class="od">${e.p ? spanLabel(e.p) : shortLabel(e.date)} · <span style="color:${secColor(secs, e.s)}">●</span>`
        + ` ${sec ? esc(sec.name) : ""}</span>` + (ed ? `<button type="button" class="tt">오늘로 옮기기</button>` : "") + `</li>`;
    }).join("") + `</ul>`;
  }
  return html + `</div>`;
}

function renderPcDay(v) {
  const ed = canEdit(), k = pc.cur, tk = iso(new Date());
  const keep = keepDay(v);
  const diff = Math.round((fromIso(k) - fromIso(tk)) / 864e5), hol = snap.holidays[k];
  let html = `<div class="dv${ed ? " edit" : ""}"><div class="dhead"><span class="dtitle ${dayCls(k)}">${fullLabel(k)}</span>`
    + (hol ? `<span class="dhol">${esc(hol)}</span>` : "") + `<span class="sp"></span>`
    + `<span class="muted">${diff === 0 ? "오늘" : `${Math.abs(diff)}일 ${diff > 0 ? "후" : "전"}`}</span></div>` + overdueHtml(ed);
  const entries = data.days[k] || [], n = snap.sections.length;
  const cols = pcColumns(n, v.clientWidth, v.clientHeight), rows = Math.ceil(n / cols);
  html += `<div class="sgrid" style="grid-template-columns:repeat(${cols},minmax(0,1fr));grid-template-rows:repeat(${rows},minmax(150px,1fr))">`;
  const shown = new Set();
  for (const sec of snap.sections) {
    const list = entries.filter((e) => e.s === sec.id), done = list.filter((e) => e.done).length;
    list.forEach((e) => shown.add(e.id));
    html += `<div class="card" data-s="${esc(sec.id)}"><div class="chead"><span class="cb5" style="background:${sec.color}"></span>`
      + `<b>${esc(sec.name)}</b><span class="cnt">${list.length ? `${done}/${list.length}` : ""}</span></div>`
      + `<ul class="cl" data-s="${esc(sec.id)}">${list.map((e) => pcRow(e, k)).join("")}</ul>`
      + (ed ? `<form class="addf" data-s="${esc(sec.id)}"><input class="addin" data-s="${esc(sec.id)}" maxlength="500"`
        + ` placeholder="+ 할 일 입력 후 Enter" aria-label="${esc(sec.name)}에 할 일 추가"></form>` : "")
      + `</div>`;
  }
  for (const id of [...pc.chosen]) if (!shown.has(id)) pc.chosen.delete(id);
  v.innerHTML = html + `</div></div>`;
  keep();
}

// 다시 그려도 입력하던 글·포커스, 같은 날이면 스크롤 위치까지 그대로
function keepDay(v) {
  const restoreInputs = keepInputs(v, ".addin");
  const scroll = {};
  for (const ul of v.querySelectorAll(".cl")) scroll[ul.dataset.s] = ul.scrollTop;
  const dv = v.querySelector(".dv"), od = v.querySelector(".odp ul");
  const top = dv ? dv.scrollTop : 0, odTop = od ? od.scrollTop : 0, same = pc.keptDate === pc.cur;
  pc.keptDate = pc.cur;
  return () => {
    restoreInputs();
    if (!same) return;
    for (const ul of v.querySelectorAll(".cl")) ul.scrollTop = scroll[ul.dataset.s] || 0;
    const dv2 = v.querySelector(".dv"), od2 = v.querySelector(".odp ul");
    if (dv2) dv2.scrollTop = top;
    if (od2) od2.scrollTop = odTop;
  };
}

// ---------------- 선택 (PC: 클릭 하나, Ctrl+클릭 더하기·빼기, Shift+클릭 범위, Ctrl+드래그 더하기, 빈 곳 클릭 풀기)
function markChosen() {
  for (const li of document.querySelectorAll("#pc .cl li[data-id]")) li.classList.toggle("sel", pc.chosen.has(li.dataset.id));
}
function clearChosen() {
  if (!pc.chosen.size) return;
  pc.chosen.clear();
  markChosen();
}
// 고른 항목 id (섹션 순서, 섹션 안에서는 보이는 순서)
const chosenIds = () => [...document.querySelectorAll("#pc .cl li.sel[data-id]")].map((li) => li.dataset.id);
const rowOf = (id) => document.querySelector(`#pc .cl li[data-id="${CSS.escape(id)}"]`);
const startOf = (e) => (e.p ? e.p[0] : pc.cur);  // 옮길 때 기준 날짜 (기간 일정은 시작일)

// ---------------- 이동
function pcGo(mode, k) {
  pc.mode = mode;
  if (k) pc.cur = k;
  lsSet(PC_MODE_STORE, mode);
  pc.chosen.clear();
  closeMenu();
  render();
}
function pcStep(n) {
  pc.cur = pc.mode === "day" ? addDays(pc.cur, n) : addMonths(pc.cur, pc.mode === "month" ? n : 12 * n);
  closeMenu();
  render();
}
const goUp = () => { if (pc.mode !== "year") pcGo(pc.mode === "day" ? "month" : "year"); };
const goDown = () => { if (pc.mode !== "day") pcGo(pc.mode === "year" ? "month" : "day"); };

// ---------------- 고치기
function toggleDone(ids) {
  const es = ids.map(findEntry).filter(Boolean), done = !es.every((e) => e.done);
  addOps(es.map((e) => ["done", {item: e.id, done}]));
}
function deleteIds(ids) {
  const es = ids.map(findEntry).filter(Boolean);
  if (!es.length) return;
  const rec = es.some((e) => e.r);
  if (es.length > 1) {
    if (!confirm(`고른 할 일 ${es.length}개를 삭제할까요?` + (rec ? "\n반복 항목은 이 날짜 것만 지워집니다." : ""))) return;
  } else if (rec && !confirm(`「${es[0].t}」은(는) 반복 항목이에요. 이 날짜 것만 지울까요?`)) return;
  for (const e of es) pc.chosen.delete(e.id);
  addOps(es.map((e) => ["delete", {item: e.id}]));
}
function moveIds(ids, where) {  // where(e) → {date, section?}
  const es = ids.map(findEntry).filter(Boolean);
  addOps(es.map((e) => ["move", {item: e.id, ...where(e)}]));
}

// 인라인 수정: 더블클릭·F2. Enter·포커스 잃음 = 저장, Esc = 취소, 빈 글 = 원래대로
function startEdit(id) {
  const li = rowOf(id), e = findEntry(id);
  if (!li || !e || !canEdit()) return;
  closeMenu();
  hideTip();
  pc.editing = true;
  const tx = li.querySelector(".tx");
  tx.innerHTML = `<input class="ined" maxlength="500" aria-label="할 일 수정">`;
  const inp = tx.querySelector("input");
  inp.value = e.t;
  inp.focus();
  inp.select();
  let over = false;
  const finish = (save) => {
    if (over) return;
    over = true;
    pc.editing = false;
    const text = inp.value.trim();
    if (save && text && text !== e.t) addOps([["text", {item: id, text}]]);
    else render();
  };
  inp.addEventListener("keydown", (k) => {
    k.stopPropagation();
    if (k.isComposing) return;
    if (k.key === "Enter") { k.preventDefault(); finish(true); }
    else if (k.key === "Escape") { k.preventDefault(); finish(false); }
  });
  inp.addEventListener("blur", () => finish(true));
}

// ---------------- 우클릭 메뉴 (PC 프로그램과 같은 순서)
function openMenu(x, y, ids) {
  const es = ids.map(findEntry).filter(Boolean);
  if (!es.length) return;
  const multi = es.length > 1, allStar = es.every((e) => e.star);
  const tomorrow = addDays(iso(new Date()), 1), pcOnly = "PC 프로그램에서만 할 수 있어요";
  const items = [];
  if (multi) items.push({label: `할 일 ${es.length}개 선택됨`, off: true}, "-");
  items.push(
    {label: allStar ? "중요 표시 해제" : "중요 표시 ★", fn: () => addOps(es.map((e) => ["star", {item: e.id, star: !allStar}]))},
    "-",
    {label: "수정", key: "F2", off: multi, fn: () => startEdit(es[0].id)},
    {label: "삭제", key: "Delete", fn: () => deleteIds(ids)},
    "-",
    {label: "내일로 옮기기", off: es.every((e) => startOf(e) === tomorrow), fn: () => moveIds(ids, () => ({date: tomorrow}))},
    {label: "전날로 옮기기", fn: () => moveIds(ids, (e) => ({date: addDays(startOf(e), -1)}))},
    {label: "다른 날짜로 이동…", fn: () => askDate(startOf(es[0]), (k) => moveIds(ids, () => ({date: k})))},
    {label: "섹션 이동", sub: snap.sections.map((s) => ({label: s.name, color: s.color, off: es.every((e) => e.s === s.id),
      fn: () => moveIds(ids, (e) => ({date: startOf(e), section: s.id}))}))},
    "-",
    {label: "기간 설정…", off: true, tip: pcOnly},
    {label: "반복 설정…", off: true, tip: pcOnly});
  const m = $("#pc-menu");
  m.innerHTML = "";
  m.append(buildMenu(items));
  m.classList.remove("hidden");
  const w = m.offsetWidth, h = m.offsetHeight;
  m.style.left = `${Math.max(4, Math.min(x, innerWidth - w - 4))}px`;
  m.style.top = `${Math.max(4, Math.min(y, innerHeight - h - 4))}px`;
}

function buildMenu(items) {
  const box = document.createElement("div");
  box.className = "menu";
  for (const it of items) {
    if (it === "-") { box.insertAdjacentHTML("beforeend", `<div class="msep"></div>`); continue; }
    const row = document.createElement("div");
    row.className = "mr" + (it.off ? " dis" : "") + (it.sub ? " sub" : "");
    row.innerHTML = (it.color ? `<span style="color:${it.color}">●</span>` : "") + `<span>${esc(it.label)}</span>`
      + (it.key ? `<span class="k">${it.key}</span>` : "");
    if (it.tip) row.title = it.tip;
    if (it.sub) {
      const child = buildMenu(it.sub);
      child.classList.add("child", "hidden");
      row.append(child);
      row.addEventListener("mouseenter", () => {
        child.classList.remove("hidden", "flip");
        if (child.getBoundingClientRect().right > innerWidth - 4) child.classList.add("flip");
      });
      row.addEventListener("mouseleave", () => child.classList.add("hidden"));
    } else if (!it.off) {
      row.addEventListener("click", (ev) => { ev.stopPropagation(); closeMenu(); it.fn(); });
    }
    box.append(row);
  }
  return box;
}
function closeMenu() { $("#pc-menu").classList.add("hidden"); $("#pc-menu").innerHTML = ""; }

// 「다른 날짜로 이동…」
function askDate(start, done) {
  pc.dateDone = done;
  $("#pc-date").value = start;
  $("#pc-dlg").classList.remove("hidden");
  $("#pc-date").focus();
}
function closeDlg() { $("#pc-dlg").classList.add("hidden"); pc.dateDone = null; }
$("#pc-dlg-form").addEventListener("submit", (ev) => {
  ev.preventDefault();
  const k = $("#pc-date").value, done = pc.dateDone;
  closeDlg();
  if (k && done) done(k);
});
$("#pc-dlg-cancel").onclick = closeDlg;
$("#pc-dlg").addEventListener("mousedown", (ev) => { if (ev.target.id === "pc-dlg") closeDlg(); });

// ---------------- 툴팁: 날짜 칸(그날 항목 전체), 기간·반복 항목
function dayTip(k) {
  const list = data.days[k] || [], hol = snap.holidays[k];
  if (!list.length && !hol) return "";
  const secs = secMap(), d = fromIso(k);
  return `<b>${d.getMonth() + 1}월 ${d.getDate()}일 (${wdOf(k)})</b>` + (hol ? ` <span class="r">${esc(hol)}</span>` : "")
    + (list.length ? `<table>` + list.map((e) => `<tr><td style="color:${secColor(secs, e.s)}">●</td><td>`
      + (e.star ? `<span class="s">★</span> ` : "") + (e.done ? `<s class="muted">${esc(e.t)}</s>` : esc(e.t))
      + (e.p ? ` <span class="muted">${spanLabel(e.p)}</span>` : "") + `</td></tr>`).join("") + `</table>` : "");
}
let tipTimer = null;
function hideTip() {
  clearTimeout(tipTimer);
  pc.tipEl = null;
  $("#pc-tip").classList.add("hidden");
}
function showTip(el, x, y) {
  const html = el.dataset.tip ? esc(el.dataset.tip) : dayTip(el.dataset.d);
  if (!html || !document.body.contains(el)) return;
  const t = $("#pc-tip");
  t.innerHTML = html;
  t.classList.remove("hidden");
  t.style.left = `${Math.max(4, Math.min(x + 12, innerWidth - t.offsetWidth - 4))}px`;
  t.style.top = `${y + 20 + t.offsetHeight > innerHeight ? y - t.offsetHeight - 8 : y + 20}px`;
}

// ---------------- 마우스·키보드
const pcv = $("#pc-view");
$("#pc-prev").onclick = () => pcStep(-1);
$("#pc-next").onclick = () => pcStep(1);
$("#pc-today").onclick = () => { pc.cur = iso(new Date()); closeMenu(); render(); };
for (const b of document.querySelectorAll("#pc-modes button")) b.onclick = () => pcGo(b.dataset.m);
$("#pc-reload").onclick = () => load();
$("#pc-lock").onclick = () => { closeMenu(); forgetKey(); pc.cur = null; showLock(""); };

pcv.addEventListener("click", (ev) => {
  if (pc.mode === "year") {
    const d = ev.target.closest(".d[data-d]");
    if (d) { pcGo("day", d.dataset.d); return; }
    const box = ev.target.closest(".ym");
    if (box) {  // 달 제목·빈 칸: 그 달 월 보기 (같은 달이면 보던 날짜 유지)
      const c = fromIso(pc.cur), m = Number(box.dataset.m);
      pcGo("month", c.getMonth() === m ? pc.cur : iso(new Date(c.getFullYear(), m, 1)));
    }
    return;
  }
  if (pc.mode === "month") {
    const cell = ev.target.closest(".mc[data-d]");
    if (cell) pcGo("day", cell.dataset.d);
    return;
  }
  if (ev.target.closest(".odp .tg")) { lsSet(PC_FOLD_STORE, lsGet(PC_FOLD_STORE) === "1" ? null : "1"); render(); return; }
  if (!canEdit()) return;
  if (ev.target.closest(".odp .all")) { moveIds(data.overdue.map((e) => e.id), () => ({date: iso(new Date())})); return; }
  const li = ev.target.closest("li[data-id]");
  const e = li && findEntry(li.dataset.id);
  if (!e) return;
  const inOverdue = Boolean(li.closest(".odp"));
  if (inOverdue && ev.target.closest(".tt")) addOps([["move", {item: e.id, date: iso(new Date())}]]);  // 기간 일정은 기간째
  else if (ev.target.closest(".cbx") || (inOverdue && ev.target.closest(".tx"))) addOps([["done", {item: e.id, done: !e.done}]]);
  else if (ev.target.closest(".pst")) addOps([["star", {item: e.id, star: !e.star}]]);
});

pcv.addEventListener("mousedown", (ev) => {
  if (ev.button !== 0 || pc.mode !== "day") return;
  const li = ev.target.closest(".cl li[data-id]");
  if (!li || ev.target.closest(".cbx, .pst, .ined")) return;
  const id = li.dataset.id, rows = [...li.parentElement.querySelectorAll("li[data-id]")];
  if (ev.shiftKey && pc.anchor && rows.some((r) => r.dataset.id === pc.anchor)) {  // 같은 섹션 안 범위
    const a = rows.findIndex((r) => r.dataset.id === pc.anchor), b = rows.indexOf(li);
    pc.chosen = new Set(rows.slice(Math.min(a, b), Math.max(a, b) + 1).map((r) => r.dataset.id));
  } else if (ev.ctrlKey || ev.metaKey) {
    if (pc.chosen.has(id)) pc.chosen.delete(id); else pc.chosen.add(id);
    pc.anchor = id;
    pc.dragSel = true;  // 누른 채 끌면 지나간 항목을 더한다
  } else {
    pc.chosen = new Set([id]);
    pc.anchor = id;
  }
  markChosen();
});
pcv.addEventListener("mouseover", (ev) => {
  if (pc.dragSel && ev.buttons & 1) {
    const li = ev.target.closest(".cl li[data-id]");
    if (li && !pc.chosen.has(li.dataset.id)) { pc.chosen.add(li.dataset.id); markChosen(); }
  }
  const el = ev.target.closest("[data-d], [data-tip]");
  if (el === pc.tipEl) return;
  hideTip();
  if (!el || pc.dragSel) return;
  pc.tipEl = el;
  const x = ev.clientX, y = ev.clientY;
  tipTimer = setTimeout(() => showTip(el, x, y), 600);
});
pcv.addEventListener("mouseleave", hideTip);

pcv.addEventListener("dblclick", (ev) => {
  if (pc.mode !== "day" || !canEdit()) return;
  const li = ev.target.closest(".cl li[data-id]");
  if (li && !ev.target.closest(".cbx, .pst, .ined")) startEdit(li.dataset.id);
});

pcv.addEventListener("contextmenu", (ev) => {
  if (pc.mode !== "day") return;
  const li = ev.target.closest(".cl li[data-id]");
  if (!li || ev.target.closest(".ined")) return;
  ev.preventDefault();
  hideTip();
  if (!canEdit()) return;
  const id = li.dataset.id;
  if (!pc.chosen.has(id)) { pc.chosen = new Set([id]); pc.anchor = id; markChosen(); }  // 고르지 않은 항목은 그것만
  openMenu(ev.clientX, ev.clientY, chosenIds());
});

pcv.addEventListener("submit", (ev) => {  // 섹션 입력란 Enter: 그 섹션에 추가하고 이어서 입력
  const form = ev.target.closest(".addf");
  if (!form) return;
  ev.preventDefault();
  const inp = form.querySelector("input"), text = inp.value.trim();
  if (!text) return;
  inp.value = "";
  addOps([["add", {item: newId(), date: pc.cur, section: form.dataset.s, text}]]);
});

pcv.addEventListener("wheel", (ev) => {  // 월·년 보기: 휠 한 칸에 한 달(해)
  if (pc.mode === "day" || ev.ctrlKey) return;
  ev.preventDefault();
  hideTip();
  pc.wheel += ev.deltaMode === 1 ? ev.deltaY * 33 : ev.deltaY;
  while (Math.abs(pc.wheel) >= 100) {
    const u = Math.sign(pc.wheel);
    pc.wheel -= u * 100;
    pcStep(u);
  }
}, {passive: false});

document.addEventListener("mousedown", (ev) => {
  if (!PC) return;
  if (!ev.target.closest("#pc-menu")) closeMenu();
  hideTip();
  if (ev.button === 3 || ev.button === 4) { ev.preventDefault(); return; }  // 마우스 뒤로/앞으로: 페이지를 떠나지 않게
  if (ev.button !== 0 || ev.ctrlKey || ev.metaKey || ev.shiftKey) return;
  if (!ev.target.closest("#pc-menu, #pc-dlg, .cl li[data-id], .ined")) clearChosen();  // 목록 밖·빈 곳: 선택 풀기
});
document.addEventListener("mouseup", (ev) => {
  if (!PC) return;
  pc.dragSel = false;
  if (ev.button === 3 || ev.button === 4) {  // 일 → 월 → 년 / 년 → 월 → 일
    ev.preventDefault();
    if (!$("#main").classList.contains("hidden")) { if (ev.button === 3) goUp(); else goDown(); }
  }
});
document.addEventListener("scroll", () => { if (PC) { closeMenu(); hideTip(); } }, true);

document.addEventListener("keydown", (ev) => {
  if (!PC || $("#main").classList.contains("hidden")) return;
  if (ev.key === "Escape") {
    if (!$("#pc-dlg").classList.contains("hidden")) { closeDlg(); return; }
    if (!$("#pc-menu").classList.contains("hidden")) { closeMenu(); return; }
  }
  if (!$("#pc-dlg").classList.contains("hidden") || ev.target.closest("input, textarea, select, button")) return;
  const ctrl = ev.ctrlKey || ev.metaKey, arrow = ev.key === "ArrowLeft" || ev.key === "ArrowRight";
  if (ctrl && !ev.altKey && arrow) { ev.preventDefault(); pcStep(ev.key === "ArrowLeft" ? -1 : 1); return; }
  if (ev.altKey && !ctrl && arrow) { ev.preventDefault(); if (ev.key === "ArrowLeft") goUp(); else goDown(); return; }
  if (ctrl && ev.key.toLowerCase() === "m") { ev.preventDefault(); pcGo(pc.mode === "day" ? "month" : "day"); return; }
  if (pc.mode !== "day") return;
  const anchor = pc.anchor && rowOf(pc.anchor);
  if (ctrl && ev.key.toLowerCase() === "a" && anchor) {  // 그 섹션 전체
    ev.preventDefault();
    for (const li of anchor.parentElement.querySelectorAll("li[data-id]")) pc.chosen.add(li.dataset.id);
    markChosen();
    return;
  }
  if ((ev.key === "ArrowUp" || ev.key === "ArrowDown") && !ctrl && !ev.shiftKey && !ev.altKey && anchor) {
    const sib = ev.key === "ArrowUp" ? anchor.previousElementSibling : anchor.nextElementSibling;
    ev.preventDefault();
    if (sib) { pc.chosen = new Set([sib.dataset.id]); pc.anchor = sib.dataset.id; markChosen(); sib.scrollIntoView({block: "nearest"}); }
    return;
  }
  const ids = chosenIds();
  if (!ids.length || !canEdit() || ctrl || ev.altKey) return;
  if (ev.key === " ") { ev.preventDefault(); toggleDone(ids); }
  else if (ev.key === "Delete") { ev.preventDefault(); deleteIds(ids); }
  else if (ev.key === "F2" && ids.length === 1) { ev.preventDefault(); startEdit(ids[0]); }
});

if (PC) {
  new ResizeObserver(() => { if (data && pc.cur && !$("#main").classList.contains("hidden")) { closeMenu(); renderPC(); } }).observe(pcv);
  setInterval(() => {  // 자정이 지나면: 보던 날이 어제(이전 오늘)였으면 새 오늘로
    if (!data || !pc.cur || $("#main").classList.contains("hidden")) return;
    const t = iso(new Date());
    if (pc.today && t !== pc.today) {
      if (pc.cur === pc.today) pc.cur = t;
      pc.today = t;
      render();
    }
  }, 30000);
}

load();
</script>
</body>
</html>
