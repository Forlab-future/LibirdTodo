// 설정 (PC 설정 창에서 브라우저로 바꿀 수 있는 것: 주 시작 요일, 테마(이 브라우저), 섹션)
function settingsDialog(tab) {
  const ed = canEdit();
  const rows = data.sections.map((s) => ({id: s.id, name: s.name, color: s.color, n: s.n || 0, rn: s.rn || 0, isNew: false}));
  const deleted = [];  // {row, to} 누른 순서대로 (확인을 눌러야 적용)
  const theme = lsGet(THEME_STORE) || "system";
  const off = ed ? "" : " disabled";
  const body = `<div class="tabs"><button type="button" data-tab="0">일반</button><button type="button" data-tab="1">화면</button></div>`
    + `<div data-pane="0" class="db"><div class="grp"><b>일반</b>`
    + `<div class="row"><span class="lb"><label for="st-ws">주 시작 요일</label></span><select id="st-ws"${off}>`
    + `<option value="6"${data.week_start === 6 ? " selected" : ""}>일요일</option>`
    + `<option value="0"${data.week_start === 0 ? " selected" : ""}>월요일</option></select></div></div>`
    + `<div class="muted">Windows 시작 시 자동 실행, 유휴 알림은 PC 프로그램 설정에서 바꿉니다.</div></div>`
    + `<div data-pane="1" class="db"><div class="grp"><b>화면</b>`
    + `<div class="row"><span class="lb"><label for="st-theme">테마</label></span><select id="st-theme">`
    + [["system", "기기 설정 따르기"], ["light", "라이트"], ["dark", "다크"]].map(([v, l]) =>
      `<option value="${v}"${v === theme ? " selected" : ""}>${l}</option>`).join("") + `</select>`
    + `<span class="muted">이 브라우저에만</span></div></div>`
    + `<div class="grp"><b>섹션</b><div id="st-rows" class="db"></div>`
    + `<div><button type="button" id="st-add"${off}>+ 섹션 추가</button></div></div>`
    + `<div class="muted">창 불투명도, 모바일, 데이터 설정은 PC 프로그램 설정에서 바꿉니다.</div></div>`
    + (ed ? "" : `<div class="muted">이 브라우저는 수정 연결이 안 되어 있어 테마만 바꿀 수 있어요.</div>`);
  let api;
  const drawRows = (focus) => {
    const box = api.el.querySelector("#st-rows");
    box.innerHTML = rows.map((r, i) => `<div class="secrow" data-i="${i}">`
      + `<button type="button" data-a="up" title="위로"${!ed || i === 0 ? " disabled" : ""}>▲</button>`
      + `<button type="button" data-a="down" title="아래로"${!ed || i === rows.length - 1 ? " disabled" : ""}>▼</button>`
      + `<input type="text" maxlength="40" placeholder="섹션 이름" value="${esc(r.name)}"${off}>`
      + `<input type="color" value="${esc(r.color)}"${off}>`
      + `<button type="button" data-a="del"${!ed || rows.length <= 1 ? " disabled" : ""}>삭제</button></div>`).join("");
    api.el.querySelector("#st-add").disabled = !ed || rows.length >= 8;
    if (focus) {
      const el = box.querySelector(`.secrow[data-i="${focus.i}"] ${focus.sel}`);
      const target = el && !el.disabled ? el : box.querySelector(`.secrow[data-i="${focus.i}"] input[type=text]`);
      if (target) target.focus();
    }
  };
  const removeRow = (i) => {
    const r = rows[i], other = rows.find((x) => x !== r);
    const inN = deleted.filter((d) => d.to === r).reduce((a, d) => [a[0] + d.row.n + (d.inN || 0), a[1] + d.row.rn + (d.inR || 0)], [0, 0]);
    const n = r.n + inN[0], rn = r.rn + inN[1];
    const done = (to) => { deleted.push({row: r, to, inN: inN[0], inR: inN[1]}); rows.splice(rows.indexOf(r), 1); drawRows(); };
    if (!n && !rn) { done(null); return; }
    openModal({title: "섹션 삭제",
      body: `<div>「${esc(r.name || "섹션")}」 섹션에 할 일 ${n}개, 반복 규칙 ${rn}개가 있습니다. 어떻게 할까요?</div>`
        + `<div class="muted">설정 창에서 확인을 눌러야 실제로 적용됩니다.</div>`,
      buttons: [{label: `「${other.name || "섹션"}」로 옮기기`, fn: () => done(other)}, {label: "함께 삭제", fn: () => done(null)},
        "|", {label: "취소", cancel: true}]});
  };
  const save = () => {
    lsSet(THEME_STORE, api.el.querySelector("#st-theme").value === "system" ? null : api.el.querySelector("#st-theme").value);
    applyTheme();
    if (!ed) { render(); return; }
    const ops = [];
    // 1) 새 섹션 (지운 새 섹션은 다른 섹션 항목을 받았을 때만 만들었다가 지운다)
    const needed = new Set(deleted.filter((d) => d.to && d.to.isNew).map((d) => d.to.id));
    for (const r of [...rows, ...deleted.map((d) => d.row)]) {
      if (r.isNew && (rows.includes(r) || needed.has(r.id))) ops.push(["addsection", {section: r.id, name: r.name.trim(), color: r.color.toUpperCase()}]);
    }
    // 2) 삭제 (누른 순서: 앞에서 옮겨 둔 섹션을 다시 지우면 그 항목도 다음 섹션으로 간다)
    for (const d of deleted) {
      if (!d.row.isNew || needed.has(d.row.id)) ops.push(["delsection", {section: d.row.id, move_to: d.to ? d.to.id : null}]);
    }
    // 3) 이름·색
    for (const r of rows) {
      const s = !r.isNew && data.sections.find((x) => x.id === r.id);
      if (s && ((r.name.trim() && r.name.trim() !== s.name) || r.color.toUpperCase() !== s.color.toUpperCase())) {
        ops.push(["section", {section: r.id, name: r.name.trim() || s.name, color: r.color.toUpperCase()}]);
      }
    }
    // 4) 순서
    const gone = new Set(deleted.map((d) => d.row.id));
    const now = data.sections.map((s) => s.id).filter((id) => !gone.has(id)).concat(rows.filter((r) => r.isNew).map((r) => r.id));
    if (rows.map((r) => r.id).join() !== now.join()) ops.push(["sectionorder", {ids: rows.map((r) => r.id)}]);
    // 5) 주 시작 요일 (PC 설정)
    const ws = Number(api.el.querySelector("#st-ws").value);
    if (ws !== data.week_start) ops.push(["setting", {key: "week_start", value: ws}]);
    if (ops.length) addOps(ops); else render();
  };
  api = openModal({title: "설정", body, buttons: ["|", {label: "취소", cancel: true}, {label: "확인", primary: true, fn: save}],
    onOpen: (a) => {
      api = a;
      const showTab = (n) => {
        for (const b of a.el.querySelectorAll("[data-tab]")) b.classList.toggle("on", b.dataset.tab === String(n));
        for (const p of a.el.querySelectorAll("[data-pane]")) p.classList.toggle("hidden", p.dataset.pane !== String(n));
      };
      a.el.addEventListener("click", (ev) => {
        const t = ev.target.closest("[data-tab]");
        if (t) { showTab(Number(t.dataset.tab)); return; }
        if (ev.target.closest("#st-add") && rows.length < 8) {
          const used = new Set(rows.map((r) => r.color.toLowerCase()));
          rows.push({id: newId(), name: "", color: SECTION_COLORS.find((c) => !used.has(c.toLowerCase())) || SECTION_COLORS[rows.length % 8],
            n: 0, rn: 0, isNew: true});
          drawRows({i: rows.length - 1, sel: "input[type=text]"});
          return;
        }
        const btn = ev.target.closest(".secrow button");
        if (!btn) return;
        const i = Number(btn.closest(".secrow").dataset.i);
        if (btn.dataset.a === "del") { removeRow(i); return; }
        const j = btn.dataset.a === "up" ? i - 1 : i + 1;
        [rows[i], rows[j]] = [rows[j], rows[i]];
        drawRows({i: j, sel: `[data-a="${btn.dataset.a}"]`});  // 누른 버튼에 포커스 (끝에 닿으면 이름 칸)
      });
      a.el.addEventListener("input", (ev) => {
        const row = ev.target.closest(".secrow");
        if (!row) return;
        const r = rows[Number(row.dataset.i)];
        if (ev.target.type === "color") r.color = ev.target.value; else r.name = ev.target.value;
      });
      drawRows();
      showTab(tab || 0);
    }});
}

// ---------------- 우클릭 메뉴 (PC 프로그램 메뉴 + 브라우저라서 더한 메뉴: 섹션, 날짜, 빈 곳)
function itemMenu(ts, overdue) {
  const multi = ts.length > 1, one = ts[0], allStar = ts.every((t) => t.e.star);
  const today = iso(new Date()), tomorrow = addDays(today, 1);
  const items = [];
  if (multi) items.push({label: `할 일 ${ts.length}개 선택됨`, off: true}, "-");
  if (overdue) items.push({label: "오늘로 옮기기", fn: () => moveTargets(ts, () => ({date: today}))},
    {label: "완료", fn: () => addOps(ts.map((t) => ["done", {item: t.id, done: true}]))}, "-");
  items.push({label: allStar ? "중요 표시 해제" : "중요 표시 ★", fn: () => addOps(ts.map((t) => ["star", {item: t.id, star: !allStar}]))}, "-");
  if (!overdue) items.push({label: "수정", key: "F2", off: multi, fn: () => startEdit(one.id)});
  items.push({label: "삭제", key: overdue ? "" : "Delete", fn: () => deleteTargets(ts)}, "-",
    {label: "내일로 옮기기", off: ts.every((t) => t.date === tomorrow), fn: () => moveTargets(ts, () => ({date: tomorrow}))},
    {label: "전날로 옮기기", fn: () => moveTargets(ts, (t) => ({date: addDays(t.date, -1)}))},
    {label: "다른 날짜로 이동…", fn: () => askDate(one.date, (k) => moveTargets(ts, () => ({date: k})))},
    {label: "섹션 이동", sub: data.sections.map((s) => ({label: s.name, color: s.color, off: ts.every((t) => t.e.s === s.id),
      fn: () => moveTargets(ts, (t) => ({date: t.date, section: s.id}))}))},
    "-",
    {label: "기간 설정…", off: multi || one.e.r, fn: () => periodDialog(one)},
    {label: "반복 설정…", off: multi || Boolean(one.e.p), fn: () => recurDialog(one)});
  return items;
}
function sectionMenu(sid) {

function generalMenu() {

// 수정 연결: PC 프로그램에서 복사한 연결 주소를 붙여 넣는다 (주소창에 붙여 넣는 것과 같다)
function pairDialog() {
  const body = `<div style="line-height:1.8">1. PC 프로그램에서 ⚙ 설정 → 모바일 탭 → 「폰 연결 QR…」을 누릅니다.<br>`
    + `2. 「연결 주소 복사」를 누릅니다.<br>3. 아래 칸에 붙여 넣고(Ctrl+V) 「연결」을 누릅니다.</div>`
    + `<input id="pr-code" placeholder="https://…/#pair=1.…" aria-label="연결 주소" style="width:100%">`
    + `<div class="muted">이 브라우저에서 한 번만 하면 됩니다. 연결 주소에는 GitHub 토큰이 보기 비밀번호로 암호화되어 들어 있습니다.</div>`;
  openModal({title: "수정 연결", body, buttons: ["|", {label: "취소", cancel: true}, {label: "연결", primary: true, fn: (api) => {
    const m = api.el.querySelector("#pr-code").value.trim().match(/(?:#pair=)?(1\.[A-Za-z0-9_-]{20,})$/);
    if (!m) { api.error("연결 주소가 아니에요. PC 프로그램의 「연결 주소 복사」로 복사한 주소를 붙여 넣으세요."); return false; }
    connectPair(m[1]);
  }}]});
}
function dateMenu(k, withMonth) {
  return [{label: "이 날 보기", fn: () => pcGo("day", k)},
    {label: "이 날에 할 일 추가", key: "N", off: !canEdit(), fn: () => { pcGo("day", k); focusAdd(); }},
    ...(withMonth ? [{label: "이 달 보기", fn: () => pcGo("month", k)}] : []), "-", ...generalMenu()];
}

function openMenu(x, y, items) {
  const m = $("#pc-menu");
  m.innerHTML = "";
  m.append(buildMenu(items));
  m.classList.remove("hidden");
  const w = m.offsetWidth, h = m.offsetHeight;
  m.style.left = `${Math.max(4, Math.min(x, innerWidth - w - 4))}px`;
  m.style.top = `${Math.max(4, Math.min(y, innerHeight - h - 4))}px`;
}
function buildMenu(items) {
  const box = document.createElement("div");
  box.className = "menu";
  for (const it of items) {
    if (it === "-") { box.insertAdjacentHTML("beforeend", `<div class="msep"></div>`); continue; }
    const row = document.createElement("div");
    row.className = "mr" + (it.off ? " dis" : "") + (it.sub ? " sub" : "");
    row.innerHTML = (it.check ? `<span class="ck">✓</span>` : "") + (it.color ? `<span style="color:${it.color}">●</span>` : "")
      + `<span>${esc(it.label)}</span>` + (it.key ? `<span class="k">${it.key}</span>` : "");
    if (it.tip) row.title = it.tip;
    if (it.sub) {
      const child = buildMenu(it.sub);
      child.classList.add("child", "hidden");
      row.append(child);
      row.addEventListener("mouseenter", () => {
        child.classList.remove("hidden", "flip");
        if (child.getBoundingClientRect().right > innerWidth - 4) child.classList.add("flip");
      });
      row.addEventListener("mouseleave", () => child.classList.add("hidden"));
    } else if (!it.off) {
      row.addEventListener("click", (ev) => { ev.stopPropagation(); closeMenu(); it.fn(); });
    }
    box.append(row);
  }
  return box;
}
function closeMenu() { $("#pc-menu").classList.add("hidden"); $("#pc-menu").innerHTML = ""; }

// ---------------- 툴팁: 날짜 칸(그날 항목 전체), 기간·반복 항목
function dayTip(k) {
  const list = data.days[k] || [], hol = snap.holidays[k];
  if (!list.length && !hol) return "";
  const secs = secMap(), d = fromIso(k);
  return `<b>${d.getMonth() + 1}월 ${d.getDate()}일 (${wdOf(k)})</b>` + (hol ? ` <span class="r">${esc(hol)}</span>` : "")
    + (list.length ? `<table>` + list.map((e) => `<tr><td style="color:${secColor(secs, e.s)}">●</td><td>`
      + (e.star ? `<span class="s">★</span> ` : "") + (e.done ? `<s class="muted">${esc(e.t)}</s>` : esc(e.t))
      + (e.p ? ` <span class="muted">${spanLabel(e.p)}</span>` : "") + `</td></tr>`).join("") + `</table>` : "");
}
let tipTimer = null;
function hideTip() {
  clearTimeout(tipTimer);
  pc.tipEl = null;
  $("#pc-tip").classList.add("hidden");
}
function showTip(el, x, y) {
  const html = el.dataset.tip ? esc(el.dataset.tip) : dayTip(el.dataset.d);
  if (!html || !document.body.contains(el)) return;
  const t = $("#pc-tip");
  t.innerHTML = html;
  t.classList.remove("hidden");
  t.style.left = `${Math.max(4, Math.min(x + 12, innerWidth - t.offsetWidth - 4))}px`;
  t.style.top = `${y + 20 + t.offsetHeight > innerHeight ? y - t.offsetHeight - 8 : y + 20}px`;
}

// ---------------- 드래그로 옮기기 (PC와 같다: 고른 항목을 보이는 순서대로, 놓은 줄은 항목 세로 가운데 기준)
function dropSpot(ev) {
  const card = ev.target.closest && ev.target.closest("#pc .card");
  if (!card) return null;
  const ul = card.querySelector(".cl"), rows = [...ul.querySelectorAll("li[data-id]")];
  let index = rows.length;
  for (let i = 0; i < rows.length; i++) {
    const r = rows[i].getBoundingClientRect();
    if (ev.clientY < r.top + r.height / 2) { index = i; break; }
  }
  return {ul, rows, index, section: card.dataset.s};
}
function clearDrop() {
  for (const el of document.querySelectorAll("#pc .drop-before, #pc .drop-end")) el.classList.remove("drop-before", "drop-end");
}

// ---------------- 마우스·키보드
const pcv = $("#pc-view");
$("#pc-prev").onclick = () => pcStep(-1);
$("#pc-next").onclick = () => pcStep(1);
$("#pc-today").onclick = goToday;
for (const b of document.querySelectorAll("#pc-modes button")) b.onclick = () => pcGo(b.dataset.m);
$("#pc-reload").onclick = () => load();
$("#pc-settings").onclick = () => settingsDialog(0);
$("#pc-lock").onclick = lockNow;

pcv.addEventListener("click", (ev) => {
  if (pc.mode === "year") {
    const d = ev.target.closest(".d[data-d]");
    if (d) { pcGo("day", d.dataset.d); return; }
    const box = ev.target.closest(".ym");
    if (box) {  // 달 제목·빈 칸: 그 달 월 보기 (같은 달이면 보던 날짜 유지)
      const c = fromIso(pc.cur), m = Number(box.dataset.m);
      pcGo("month", c.getMonth() === m ? pc.cur : iso(new Date(c.getFullYear(), m, 1)));
    }
    return;
  }
  if (pc.mode === "month") {
    const cell = ev.target.closest(".mc[data-d]");
    if (cell) pcGo("day", cell.dataset.d);
    return;
  }
  if (ev.target.closest(".odp .tg")) { lsSet(PC_FOLD_STORE, lsGet(PC_FOLD_STORE) === "1" ? null : "1"); render(); return; }
  if (!canEdit()) return;
  if (ev.target.closest(".odp .all")) { moveTargets(data.overdue.map((e) => ({id: e.id, e})), () => ({date: iso(new Date())})); return; }
  const li = ev.target.closest("li[data-id]");
  const e = li && findEntry(li.dataset.id);
  if (!e) return;
  const inOverdue = Boolean(li.closest(".odp"));
  if (inOverdue && ev.target.closest(".tt")) addOps([["move", {item: e.id, date: iso(new Date())}]]);  // 기간 일정은 기간째
  else if (ev.target.closest(".cbx") || (inOverdue && ev.target.closest(".tx"))) addOps([["done", {item: e.id, done: !e.done}]]);
  else if (ev.target.closest(".pst")) addOps([["star", {item: e.id, star: !e.star}]]);
});

pcv.addEventListener("mousedown", (ev) => {
  pc.single = null;
  if (ev.button !== 0 || pc.mode !== "day") return;
  const li = ev.target.closest(".cl li[data-id]");
  if (!li || ev.target.closest(".cbx, .pst, .ined")) return;
  const id = li.dataset.id, rows = [...li.parentElement.querySelectorAll("li[data-id]")];
  if (ev.shiftKey && pc.anchor && rows.some((r) => r.dataset.id === pc.anchor)) {  // 같은 섹션 안 범위
    const a = rows.findIndex((r) => r.dataset.id === pc.anchor), b = rows.indexOf(li);
    pc.chosen = new Set(rows.slice(Math.min(a, b), Math.max(a, b) + 1).map((r) => r.dataset.id));
  } else if (ev.ctrlKey || ev.metaKey) {
    if (pc.chosen.has(id)) pc.chosen.delete(id); else pc.chosen.add(id);
    pc.anchor = id;
    pc.dragSel = true;  // 누른 채 끌면 지나간 항목을 더한다 (옮기지 않는다)
  } else if (pc.chosen.has(id) && pc.chosen.size > 1) {
    pc.single = id;  // 고른 것 중 하나: 끌면 고른 것 전체를 옮기고, 그냥 떼면 그것 하나만 고른다
    pc.anchor = id;
  } else {
    pc.chosen = new Set([id]);
    pc.anchor = id;
  }
  markChosen();
});
pcv.addEventListener("mouseover", (ev) => {
  if (pc.dragSel && ev.buttons & 1) {
    const li = ev.target.closest(".cl li[data-id]");
    if (li && !pc.chosen.has(li.dataset.id)) { pc.chosen.add(li.dataset.id); markChosen(); }
  }
  const el = ev.target.closest("[data-d], [data-tip]");
  if (el === pc.tipEl) return;
  hideTip();
  if (!el || pc.dragSel || pc.drag) return;
  pc.tipEl = el;
  const x = ev.clientX, y = ev.clientY;
  tipTimer = setTimeout(() => showTip(el, x, y), 600);
});
pcv.addEventListener("mouseleave", hideTip);

pcv.addEventListener("dblclick", (ev) => {
  if (pc.mode !== "day" || !canEdit()) return;
  const head = ev.target.closest(".chead");
  if (head) { sectionDialog(data.sections.find((s) => s.id === head.closest(".card").dataset.s)); return; }
  const li = ev.target.closest(".cl li[data-id]");
  if (li && !ev.target.closest(".cbx, .pst, .ined")) startEdit(li.dataset.id);
});

pcv.addEventListener("submit", (ev) => {  // 섹션 입력란 Enter: 그 섹션에 추가하고 이어서 입력
  const form = ev.target.closest(".addf");
  if (!form) return;
  ev.preventDefault();
  const inp = form.querySelector("input"), text = inp.value.trim();
  if (!text) return;
  inp.value = "";
  addOps([["add", {item: newId(), date: pc.cur, section: form.dataset.s, text}]]);
});
pcv.addEventListener("focusin", (ev) => { if (ev.target.matches(".addin")) pc.lastSec = ev.target.dataset.s; });

pcv.addEventListener("dragstart", (ev) => {
  const li = ev.target.closest && ev.target.closest(".cl li[data-id]");
  if (!li || !canEdit() || pc.editing || pc.dragSel || ev.ctrlKey || ev.metaKey) { ev.preventDefault(); return; }
  pc.single = null;
  hideTip();
  if (!pc.chosen.has(li.dataset.id)) { pc.chosen = new Set([li.dataset.id]); pc.anchor = li.dataset.id; markChosen(); }
  const ids = chosenIds();
  pc.drag = {ids};
  ev.dataTransfer.effectAllowed = "move";
  ev.dataTransfer.setData("text/plain", ids.map((id) => (findEntry(id) || {}).t || "").join("\n"));
  if (ids.length > 1) {
    const g = document.createElement("div");
    g.className = "dragimg";
    g.textContent = `할 일 ${ids.length}개`;
    document.body.append(g);
    ev.dataTransfer.setDragImage(g, 12, 12);
    setTimeout(() => g.remove(), 0);
  }
});
pcv.addEventListener("dragover", (ev) => {
  if (!pc.drag) return;
  const spot = dropSpot(ev);
  clearDrop();
  if (!spot) return;
  ev.preventDefault();
  ev.dataTransfer.dropEffect = "move";
  if (spot.index < spot.rows.length) spot.rows[spot.index].classList.add("drop-before");
  else spot.ul.classList.add("drop-end");
});
pcv.addEventListener("drop", (ev) => {
  const spot = pc.drag && dropSpot(ev);
  clearDrop();
  if (!spot) return;
  ev.preventDefault();
  const ids = pc.drag.ids;
  pc.drag = null;
  const shown = spot.rows.map((r) => r.dataset.id);
  if (ids.every((id) => shown.includes(id))) {  // 같은 목록에서 제자리면 아무것도 하지 않는다
    const before = shown.slice(0, spot.index).filter((id) => ids.includes(id)).length;
    const rest = shown.filter((id) => !ids.includes(id)), pos = spot.index - before;
    if (rest.slice(0, pos).concat(ids, rest.slice(pos)).join() === shown.join()) return;
  }
  addOps([["place", {items: ids, date: pc.cur, section: spot.section, index: spot.index}]]);
});
document.addEventListener("dragend", () => { pc.drag = null; clearDrop(); });

pcv.addEventListener("wheel", (ev) => {  // 월·년 보기: 휠 한 칸에 한 달(해)
  if (pc.mode === "day" || ev.ctrlKey) return;
  ev.preventDefault();
  hideTip();
  pc.wheel += ev.deltaMode === 1 ? ev.deltaY * 33 : ev.deltaY;
  while (Math.abs(pc.wheel) >= 100) {
    const u = Math.sign(pc.wheel);
    pc.wheel -= u * 100;
    pcStep(u);
  }
}, {passive: false});

// 우클릭: 페이지 어디서나 브라우저 메뉴 대신 그 자리에 맞는 메뉴 (글 입력 칸만 브라우저 메뉴: 붙여넣기 등)
document.addEventListener("contextmenu", (ev) => {
  if (!PC || $("#main").classList.contains("hidden")) return;
  const t = ev.target;
  if (t.closest("input, textarea, select")) return;
  ev.preventDefault();
  hideTip();
  if (t.closest("#pc-menu, .pc-ov") || !t.closest("#pc")) return;
  const ed = canEdit();
  let items;
  const li = t.closest(".cl li[data-id]"), od = t.closest(".odp li[data-id]"), card = t.closest(".card");
  if (li && pc.mode === "day") {
    const id = li.dataset.id;
    if (!pc.chosen.has(id)) { pc.chosen = new Set([id]); pc.anchor = id; markChosen(); }  // 고르지 않은 항목은 그것만
    items = ed ? itemMenu(dayTargets(chosenIds()), false) : viewOnlyMenu();
  } else if (od) {
    const ot = overdueTarget(od.dataset.id);
    items = ed && ot ? itemMenu([ot], true) : viewOnlyMenu();
  } else if (card) {
    items = ed ? sectionMenu(card.dataset.s) : viewOnlyMenu();
  } else if (t.closest(".mc[data-d]")) {
    items = dateMenu(t.closest(".mc").dataset.d, false);
  } else if (t.closest(".ym .d[data-d]")) {
    items = dateMenu(t.closest(".d").dataset.d, true);
  } else if (t.closest(".ym")) {
    const c = fromIso(pc.cur), m = Number(t.closest(".ym").dataset.m);
    items = [{label: "이 달 보기", fn: () => pcGo("month", c.getMonth() === m ? pc.cur : iso(new Date(c.getFullYear(), m, 1)))}, "-", ...generalMenu()];
  } else {
    items = generalMenu();
  }
  openMenu(ev.clientX, ev.clientY, items);
});

document.addEventListener("mousedown", (ev) => {
  if (!PC) return;
  if (!ev.target.closest("#pc-menu")) closeMenu();
  hideTip();
  if (ev.button === 3 || ev.button === 4) { ev.preventDefault(); return; }  // 마우스 뒤로/앞으로: 페이지를 떠나지 않게
  if (ev.button !== 0 || ev.ctrlKey || ev.metaKey || ev.shiftKey) return;
  if (!ev.target.closest("#pc-menu, .pc-ov, .cl li[data-id], .ined")) clearChosen();  // 목록 밖·빈 곳: 선택 풀기
});
document.addEventListener("mouseup", (ev) => {
  if (!PC) return;
  pc.dragSel = false;
  if (pc.single && ev.button === 0) { pc.chosen = new Set([pc.single]); pc.single = null; markChosen(); }
  if (ev.button === 3 || ev.button === 4) {  // 일 → 월 → 년 / 년 → 월 → 일
    ev.preventDefault();
    if (!$("#main").classList.contains("hidden") && !modalOpen()) { if (ev.button === 3) goUp(); else goDown(); }
  }
});
document.addEventListener("scroll", () => { if (PC) { closeMenu(); hideTip(); } }, true);

document.addEventListener("keydown", (ev) => {
  if (!PC || $("#main").classList.contains("hidden")) return;
  if (modalOpen()) {  // 대화상자 밖에 포커스가 있어도 Esc로 닫는다
    if (ev.key === "Escape") { const all = document.querySelectorAll(".pc-ov"); all[all.length - 1].remove(); }
    return;
  }
  if (ev.key === "Escape" && !$("#pc-menu").classList.contains("hidden")) { closeMenu(); return; }
  if (ev.target.closest("input, textarea, select, button")) return;
  const ctrl = ev.ctrlKey || ev.metaKey, arrow = ev.key === "ArrowLeft" || ev.key === "ArrowRight", plain = !ctrl && !ev.altKey;
  if (ctrl && !ev.altKey && arrow) { ev.preventDefault(); pcStep(ev.key === "ArrowLeft" ? -1 : 1); return; }
  if (ev.altKey && !ctrl && arrow) { ev.preventDefault(); if (ev.key === "ArrowLeft") goUp(); else goDown(); return; }
  if (ctrl && ev.code === "KeyM") { ev.preventDefault(); pcGo(pc.mode === "day" ? "month" : "day"); return; }
  if (plain && !ev.shiftKey && ev.code === "KeyT") { ev.preventDefault(); goToday(); return; }  // PC Ctrl+T
  if (plain && !ev.shiftKey && ev.code === "KeyN") { ev.preventDefault(); focusAdd(); return; }  // PC Ctrl+N
  if (pc.mode !== "day") return;
  const anchor = pc.anchor && rowOf(pc.anchor);
  if (ctrl && ev.code === "KeyA" && anchor) {  // 그 섹션 전체
    ev.preventDefault();
    for (const li of anchor.parentElement.querySelectorAll("li[data-id]")) pc.chosen.add(li.dataset.id);
    markChosen();
    return;
  }
  if ((ev.key === "ArrowUp" || ev.key === "ArrowDown") && plain && !ev.shiftKey && anchor) {
    const sib = ev.key === "ArrowUp" ? anchor.previousElementSibling : anchor.nextElementSibling;
    ev.preventDefault();
    if (sib) { pc.chosen = new Set([sib.dataset.id]); pc.anchor = sib.dataset.id; markChosen(); sib.scrollIntoView({block: "nearest"}); }
    return;
  }
  const ids = chosenIds();
  if (!ids.length || !canEdit() || !plain) return;
  if (ev.key === " ") { ev.preventDefault(); toggleDone(dayTargets(ids)); }
  else if (ev.key === "Delete") { ev.preventDefault(); deleteTargets(dayTargets(ids)); }
  else if (ev.key === "F2" && ids.length === 1) { ev.preventDefault(); startEdit(ids[0]); }
});

if (PC) {
  new ResizeObserver(() => { if (data && pc.cur && !$("#main").classList.contains("hidden")) { closeMenu(); renderPC(); } }).observe(pcv);
  setInterval(() => {  // 자정이 지나면: 보던 날이 어제(이전 오늘)였으면 새 오늘로
    if (!data || !pc.cur || $("#main").classList.contains("hidden")) return;
    const t = iso(new Date());
    if (pc.today && t !== pc.today) {
      if (pc.cur === pc.today) pc.cur = t;
      pc.today = t;
      render();
    }
  }, 30000);
}

load();
</script>
</body>
</html>
